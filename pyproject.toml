[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpprobe"
version = "0.1.0"
description = "Deterministic security verification and schema pinning for Model Context Protocol servers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.7,<3.0",
    "click>=8.1,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
]

[project.scripts]
mcpprobe = "mcpprobe.cli:main"
latch = "mcpprobe.cli:main"

[tool.setuptools]
packages = ["mcpprobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
