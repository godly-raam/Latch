name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Latch
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Run benchmark
        run: python -m benchmark.run_benchmark

      - name: Run CVE and upstream reference evaluation
        run: python -m cve_eval.run_cve_eval

      - name: Run adversarial self-red-team
        run: python -m adversarial.run_evasion

      - name: Run demo
        run: bash demo.sh
