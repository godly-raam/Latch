name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Latch
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,peer]"

      - name: Run tests
        run: pytest -v

      - name: Run benchmark
        run: python -m benchmark.run_benchmark

      - name: Run synthetic regression suite
        run: python -m synthetic_regression.run_regression

      - name: Run pinned-package blind evaluation
        run: python -m package_eval.run_package_eval

      - name: Run pinned-package head-to-head comparison
        run: python -m head_to_head.run_comparison

      - name: Run adversarial self-red-team (Wave 1, post-tuning)
        run: python -m adversarial.run_evasion

      - name: Verify frozen blind wave 2 baseline
        run: python -m adversarial.run_wave2_blind

      - name: Validate the external red-team schema and scorer
        run: python -m adversarial.run_external_blind --check-template

      - name: Run demo
        run: bash demo.sh
